<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="mapbox-access-token" content="">
  <script>
    const standaloneSettings = location.pathname === "/settings" ||
      /^\/setup\/(?:20kw|50kw)\/?$/.test(location.pathname) ||
      (/\/devices\/inverter-settings\/?$/.test(location.pathname) &&
       new URLSearchParams(location.search).get("standalone") === "1");
    if (standaloneSettings) {
      document.documentElement.dataset.standaloneSettings = "true";
      try {
        const saved = sessionStorage.getItem("wattdesk-standalone-theme");
        const theme = saved === "dark" ? "dark" : "light";
        localStorage.setItem("wattdesk-home-theme", theme);
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    }
  </script>
  <script src="./src/foundations/theme-bootstrap.js"></script>
  <title>WattDesk · Home</title>
  <link rel="icon" href="./home-assets/logo.svg" type="image/svg+xml">
  <link rel="preload" href="./home-assets/sf-pro.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./src/pages/plants/plants.css">
  <link rel="stylesheet" href="./src/pages/plants/detail.css">
  <link rel="stylesheet" href="./src/pages/plants/devices.css">
  <link rel="stylesheet" href="./src/pages/inverter-settings/inverter-settings.css">
  <link rel="stylesheet" href="./src/pages/inverter-settings/initialization.css">
  <link rel="stylesheet" href="./src/pages/inverter-settings/tou-settings.css">
  <link rel="stylesheet" href="./src/pages/plants/site-details.css">
  <link rel="stylesheet" href="./src/pages/plants/site-details-v2.css">
  <link rel="stylesheet" href="./src/pages/service-ticket/service-ticket.css">
  <link rel="stylesheet" href="./src/pages/home/home.css">
  <link rel="stylesheet" href="./src/shared.css">
</head>
<body>
  <main id="home" aria-label="WattDesk Home"></main>
  <div id="overlays"></div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="./src/pages/home/index.js"></script>
</body>
</html>
